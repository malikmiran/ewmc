    <!-- Footer -->

    <script>
        // Expected CSV relative paths on your GitHub Pages repo
        const DECKS = {
            "Patho hemat": { name: "Pathology Hematology", url: "Patho hemat.csv", cards: [] },
            "Comed t1": { name: "Community Medicine T1", url: "Comed t1.csv", cards: [] },
            "Patho gen": { name: "General Pathology", url: "Patho gen.csv", cards: [] }
        };

        let currentDeckKey = "Patho hemat";
        let currentIndex = 0;
        let isFlipped = false;

        // Progress Tracking (stored locally)
        let userProgress = {}; // { [deckKey]: { starred: [], mastered: [] } }

        window.addEventListener('DOMContentLoaded', () => {
            loadProgressFromStorage();
            renderDeckButtons();
            initThemes();
            fetchAllDecks();
            setupEvents();
        });

        // Initialize user session storage
        function loadProgressFromStorage() {
            try {
                const stored = localStorage.getItem('miflash_progress');
                if (stored) {
                    userProgress = JSON.parse(stored);
                }
            } catch(e) {
                console.error("Local storage error", e);
            }
        }

        function saveProgressToStorage() {
            try {
                localStorage.setItem('miflash_progress', JSON.stringify(userProgress));
                updateDeckStats();
            } catch(e) {
                console.error("Could not write progress", e);
            }
        }

        // Render selector buttons
        function renderDeckButtons() {
            const container = document.getElementById('deckSelector');
            container.innerHTML = '';
            
            Object.keys(DECKS).forEach(key => {
                const deck = DECKS[key];
                const isActive = key === currentDeckKey;
                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                    isActive 
                    ? 'bg-primary-500 text-white shadow-sm' 
                    : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600'
                }`;
                btn.textContent = deck.name;
                btn.onclick = () => selectDeck(key);
                container.appendChild(btn);
            });
        }

        function selectDeck(key) {
            currentDeckKey = key;
            currentIndex = 0;
            isFlipped = false;
            renderDeckButtons();
            renderActiveCard();
            updateDeckStats();
        }

        // Fetch all 3 CSVs on load
        function fetchAllDecks() {
            const fetchPromises = Object.keys(DECKS).map(key => {
                const deck = DECKS[key];
                // URL-encode files with spaces for safety
                const encodedUrl = encodeURIComponent(deck.url).replace(/%20/g, '%20');
                
                return fetch(encodedUrl)
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        return res.text();
                    })
                    .then(text => {
                        deck.cards = parseCSV(text);
                        console.log(`Loaded ${deck.cards.length} cards from ${deck.url}`);
                    })
                    .catch(err => {
                        console.warn(`Fetch failed for ${deck.url}.`, err);
                    });
            });

            Promise.all(fetchPromises).finally(() => {
                selectDeck(currentDeckKey);
                lucide.createIcons();
            });
        }

        // CSV line parser
        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            if (lines.length < 2) return [];

            // Find headers
            const headers = parseCSVLine(lines[0]);
            let frontIdx = 0;
            let backIdx = 1;

            for (let i = 0; i < headers.length; i++) {
                const h = headers[i].trim().toLowerCase();
                if (h === 'front' || h === 'term' || h === 'question') frontIdx = i;
                if (h === 'back' || h === 'definition' || h === 'answer') backIdx = i;
            }

            const cards = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const cols = parseCSVLine(line);
                if (cols.length < 2) continue;

                const frontVal = (cols[frontIdx] || '').trim();
                const backVal = (cols[backIdx] || '').trim();

                if (frontVal && backVal) {
                    cards.push({
                        front: cleanCSVQuotes(frontVal),
                        back: cleanCSVQuotes(backVal)
                    });
                }
            }
            return cards;
        }

        function parseCSVLine(line) {
            let row = [];
            let inQuotes = false;
            let current = '';
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    row.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            row.push(current);
            return row;
        }

        function cleanCSVQuotes(str) {
            return str.replace(/^"|"$/g, '').replace(/""/g, '"');
        }

        // Display current card details
        function renderActiveCard() {
            const deck = DECKS[currentDeckKey];
            const cardFlipper = document.getElementById('cardFlipper');
            
            if (isFlipped) {
                cardFlipper.classList.add('rotate-y-180');
            } else {
                cardFlipper.classList.remove('rotate-y-180');
            }

            if (!deck || !deck.cards || deck.cards.length === 0) {
                document.getElementById('textFront').textContent = "Cards are loading or missing...";
                document.getElementById('textBack').textContent = "Make sure your CSV files are uploaded in the same folder on your GitHub repository.";
                document.getElementById('cardIndicator').textContent = "Card 0 of 0";
                return;
            }

            const card = deck.cards[currentIndex];
            document.getElementById('textFront').innerHTML = formatMarkdownText(card.front);
            document.getElementById('textBack').innerHTML = formatMarkdownText(card.back);
            
            document.getElementById('cardIndicator').textContent = `Card ${currentIndex + 1} of ${deck.cards.length}`;

            if (!userProgress[currentDeckKey]) {
                userProgress[currentDeckKey] = { starred: [], mastered: [] };
            }
            
            const isStarred = userProgress[currentDeckKey].starred.includes(card.front);
            const isMastered = userProgress[currentDeckKey].mastered.includes(card.front);

            const starFront = document.getElementById('starBtnFront');
            const starBack = document.getElementById('starBtnBack');
            const masteredBtn = document.getElementById('masteredBtn');

            if (isStarred) {
                starFront.innerHTML = `<i data-lucide="star" class="w-5 h-5 fill-amber-400 text-amber-400"></i>`;
                starBack.innerHTML = `<i data-lucide="star" class="w-5 h-5 fill-amber-400 text-amber-400"></i>`;
            } else {
                starFront.innerHTML = `<i data-lucide="star" class="w-5 h-5 text-slate-300 dark:text-slate-600"></i>`;
                starBack.innerHTML = `<i data-lucide="star" class="w-5 h-5 text-slate-300 dark:text-slate-600"></i>`;
            }

            if (isMastered) {
                masteredBtn.innerHTML = `<i data-lucide="check-circle" class="w-3.5 h-3.5 fill-emerald-100 text-emerald-700"></i> Active Mastered`;
                masteredBtn.className = "flex-1 py-2 px-3 text-xs font-semibold bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition flex items-center justify-center gap-1.5";
            } else {
                masteredBtn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i> Mastered`;
                masteredBtn.className = "flex-1 py-2 px-3 text-xs font-semibold bg-emerald-500 text-white rounded-lg hover:bg-emerald-600 transition flex items-center justify-center gap-1.5";
            }

            lucide.createIcons();
        }

        function formatMarkdownText(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\\n|\n/g, '<br>');
        }

        function updateDeckStats() {
            const deck = DECKS[currentDeckKey];
            if (!deck || !deck.cards || deck.cards.length === 0) {
                document.getElementById('progressText').textContent = "0% (0/0)";
                return;
            }

            if (!userProgress[currentDeckKey]) {
                userProgress[currentDeckKey] = { starred: [], mastered: [] };
            }

            const total = deck.cards.length;
            const masteredCount = userProgress[currentDeckKey].mastered.length;
            const percentage = total > 0 ? Math.round((masteredCount / total) * 100) : 0;

            document.getElementById('progressText').textContent = `${percentage}% (${masteredCount}/${total})`;
        }

        function setupEvents() {
            const cardContainer = document.getElementById('cardContainer');

            // Flip Card on press
            cardContainer.addEventListener('click', (e) => {
                if (e.target.closest('#starBtnFront') || e.target.closest('#starBtnBack') || e.target.closest('#keepStudyingBtn') || e.target.closest('#masteredBtn')) {
                    return;
                }
                toggleFlip();
            });

            document.getElementById('nextBtn').addEventListener('click', handleNext);
            document.getElementById('prevBtn').addEventListener('click', handlePrev);
            document.getElementById('shuffleBtn').addEventListener('click', handleShuffle);

            document.getElementById('masteredBtn').addEventListener('click', handleToggleMastery);
            document.getElementById('keepStudyingBtn').addEventListener('click', () => {
                const deck = DECKS[currentDeckKey];
                if (deck && deck.cards[currentIndex]) {
                    const front = deck.cards[currentIndex].front;
                    const idx = userProgress[currentDeckKey].mastered.indexOf(front);
                    if (idx > -1) {
                        userProgress[currentDeckKey].mastered.splice(idx, 1);
                        saveProgressToStorage();
                        renderActiveCard();
                    }
                }
                handleNext();
            });

            const starToggle = () => {
                const deck = DECKS[currentDeckKey];
                if (!deck || !deck.cards[currentIndex]) return;
                const front = deck.cards[currentIndex].front;
                const list = userProgress[currentDeckKey].starred;
                const idx = list.indexOf(front);
                if (idx > -1) {
                    list.splice(idx, 1);
                } else {
                    list.push(front);
                }
                saveProgressToStorage();
                renderActiveCard();
            };

            document.getElementById('starBtnFront').addEventListener('click', starToggle);
            document.getElementById('starBtnBack').addEventListener('click', starToggle);

            document.getElementById('resetProgress').addEventListener('click', () => {
                if (confirm(`Reset all mastered stats for ${DECKS[currentDeckKey].name}?`)) {
                    userProgress[currentDeckKey] = { starred: [], mastered: [] };
                    saveProgressToStorage();
                    renderActiveCard();
                }
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    toggleFlip();
                } else if (e.key === 'ArrowRight') {
                    handleNext();
                } else if (e.key === 'ArrowLeft') {
                    handlePrev();
                }
            });

            // Touch Swipe Support
            let touchStart = 0;
            cardContainer.addEventListener('touchstart', (e) => {
                touchStart = e.changedTouches[0].screenX;
            }, { passive: true });

            cardContainer.addEventListener('touchend', (e) => {
                const diff = e.changedTouches[0].screenX - touchStart;
                if (diff < -50) {
                    handleNext();
                } else if (diff > 50) {
                    handlePrev();
                }
            }, { passive: true });
        }

        function toggleFlip() {
            isFlipped = !isFlipped;
            renderActiveCard();
        }

        function handleNext() {
            const deck = DECKS[currentDeckKey];
            if (!deck || deck.cards.length <= 1) return;
            isFlipped = false;
            currentIndex = (currentIndex + 1) % deck.cards.length;
            renderActiveCard();
        }

        function handlePrev() {
            const deck = DECKS[currentDeckKey];
            if (!deck || deck.cards.length <= 1) return;
            isFlipped = false;
            currentIndex = (currentIndex - 1 + deck.cards.length) % deck.cards.length;
            renderActiveCard();
        }

        function handleShuffle() {
            const deck = DECKS[currentDeckKey];
            if (!deck || deck.cards.length <= 1) return;
            for (let i = deck.cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck.cards[i], deck.cards[j]] = [deck.cards[j], deck.cards[i]];
            }
            currentIndex = 0;
            isFlipped = false;
            renderActiveCard();
        }

        function handleToggleMastery() {
            const deck = DECKS[currentDeckKey];
            if (!deck || !deck.cards[currentIndex]) return;
            const front = deck.cards[currentIndex].front;
            const list = userProgress[currentDeckKey].mastered;
            const idx = list.indexOf(front);
            if (idx > -1) {
                list.splice(idx, 1);
            } else {
                list.push(front);
                setTimeout(() => {
                    handleNext();
                }, 300);
            }
            saveProgressToStorage();
            renderActiveCard();
        }

        function initThemes() {
            const themeToggle = document.getElementById('themeToggle');
            const sunIcon = document.getElementById('sunIcon');
            const moonIcon = document.getElementById('moonIcon');

            function applyTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    sunIcon.classList.remove('hidden');
                    moonIcon.classList.add('hidden');
                } else {
                    document.documentElement.classList.remove('dark');
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                }
            }

            let isDarkSystem = localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
            applyTheme(isDarkSystem);

            themeToggle.addEventListener('click', () => {
                const isCurrentlyDark = document.documentElement.classList.contains('dark');
                localStorage.setItem('theme', isCurrentlyDark ? 'light' : 'dark');
                applyTheme(!isCurrentlyDark);
            });
        }
    </script>
</body>
</html>
